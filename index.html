<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Align</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 120%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%231B378F%22/%3E%3Cstop offset=%22.55%22 stop-color=%22%232B5BE0%22/%3E%3Cstop offset=%221%22 stop-color=%22%234F8BF7%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22120%22 height=%22120%22 rx=%2227%22 fill=%22url%28%23g%29%22/%3E%3Crect x=%2227%22 y=%2226%22 width=%223.5%22 height=%2268%22 rx=%221.75%22 fill=%22%23FFFFFF%22 fill-opacity=%22.38%22/%3E%3Crect x=%2238%22 y=%2233%22 width=%2258%22 height=%2214%22 rx=%227%22 fill=%22%23FFFFFF%22/%3E%3Crect x=%2238%22 y=%2253%22 width=%2238%22 height=%2214%22 rx=%227%22 fill=%22%23FFFFFF%22 fill-opacity=%22.72%22/%3E%3Crect x=%2238%22 y=%2273%22 width=%2250%22 height=%2214%22 rx=%227%22 fill=%22%23F2CB3D%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Align">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F3F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1120" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --paper:color-mix(in srgb,var(--accent) 5%,#F8F9FB); --surface:#FFFFFF; --ink:#0F1E3D; --ink2:#5B6C8F; --rule:#E1E9F5; --rule2:#BCCAE2;
  --accent:var(--acc-l,#2B5BE0); --soft:color-mix(in srgb,var(--accent) 11%,#fff); --on-accent:#FFFFFF; --rest:#1594BE; --warn:#D2453A; --soon:#B26B00; --blend:multiply; --hl:.85;
  --shadow:0 1px 2px rgba(20,48,120,.05),0 10px 30px rgba(20,48,120,.07);
  --serif:"Outfit","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0A1120; --surface:#111A2E; --ink:#E8EEFB; --ink2:#93A4C6; --rule:#1E2A46; --rule2:#35476F;
  --accent:var(--acc-d,#7CA4FF); --soft:color-mix(in srgb,var(--accent) 16%,#111A2E); --on-accent:#0A1120; --rest:#5CC4E6; --warn:#FF8A7A; --soon:#F5B84B; --blend:normal; --hl:.82;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); } }
:root[data-theme="dark"]{
  --paper:#0A1120; --surface:#111A2E; --ink:#E8EEFB; --ink2:#93A4C6; --rule:#1E2A46; --rule2:#35476F;
  --accent:var(--acc-d,#7CA4FF); --soft:color-mix(in srgb,var(--accent) 16%,#111A2E); --on-accent:#0A1120; --rest:#5CC4E6; --warn:#FF8A7A; --soon:#F5B84B; --blend:normal; --hl:.82;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1px solid var(--rule2);border-radius:10px;padding:.4em .95em;min-height:38px;font-weight:500;transition:background .15s,border-color .15s,color .15s}
@media (hover:hover){button:hover{border-color:var(--accent);color:var(--accent)}}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:hover{color:var(--on-accent);filter:brightness(1.08)}
button.quiet{background:none;border-color:transparent;color:var(--ink2);padding:.3em .55em}
@media (hover:hover){button.quiet:hover{color:var(--accent);background:var(--soft);border-color:transparent}}
button.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
button.danger:hover{color:var(--warn);border-color:var(--warn)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--rule2);border-radius:10px;padding:.35em .65em;min-height:38px;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:3px solid color-mix(in srgb,var(--accent) 22%,transparent);outline-offset:0}
input[type=checkbox]{min-height:0;width:18px;height:18px;accent-color:var(--accent)}
input[type=number]{width:5.2em}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.1rem} h3{font-size:1rem}
.muted{color:var(--ink2)} .small{font-size:.84rem} .num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 80%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule);
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.6rem 1rem}
.top h1{font-size:1.1rem;font-weight:700;margin-right:auto;display:flex;align-items:center;gap:.5rem}
.logo{width:1.45em;height:1.45em;flex:none}
.by{font:400 .72rem var(--sans);color:var(--ink2);letter-spacing:.03em;align-self:flex-end;padding-bottom:.18em;white-space:nowrap}
.by-foot{display:none;text-align:center;font-size:.72rem;letter-spacing:.03em;color:var(--ink2);padding:0 1rem 1.5rem}
@media (max-width:520px){.by{display:none}.by-foot{display:block}}
.tabs{display:flex;gap:.2rem;order:3;width:100%;background:var(--soft);padding:3px;border-radius:12px}
.tabs button{background:none;border:0;border-radius:9px;flex:1;color:var(--ink2);padding:.25em .2em;min-height:34px}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(20,48,120,.14)}
#sync{font-size:.8rem;border:0;background:none;color:var(--ink2);min-height:0;padding:.2em 0;font-weight:400}
#sync::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--rule2);margin-right:.4em}
#sync[data-s=synced]::before{background:var(--rest)} #sync[data-s=error]::before{background:var(--warn)}
main{max-width:1080px;margin:0 auto;padding:1.1rem 1rem 2rem}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:1.15rem;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.stack>*+*{margin-top:1rem}
.sp{margin-left:auto}

/* 오늘 */
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .8rem;margin-bottom:.9rem}
.dayhead .date{font:700 1.6rem/1.2 var(--serif);letter-spacing:-.02em}
.goal{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:.5rem}
.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--g3,#4F8BF7),var(--accent));border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{background:var(--soft);color:var(--accent);border-radius:99px;padding:.12em .75em;font-size:.82rem;font-weight:500}
.today{display:grid;gap:1rem}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px}
.seg button{background:none;border:0;border-radius:99px;min-height:30px;padding:.15em 1em;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}

/* 타이머: 화면에서 유일하게 색을 채운 카드 */
.timer{text-align:center;border:0;color:#fff;background:linear-gradient(160deg,var(--g1,#1B378F),var(--g2,#2B5BE0) 55%,var(--g3,#4F8BF7));box-shadow:0 14px 34px color-mix(in srgb,var(--g2,#2B5BE0) 32%,transparent);transition:background .4s}
.timer[data-rest]{background:linear-gradient(160deg,var(--r1,#0C5874),var(--r2,#1594BE) 55%,var(--r3,#4CC3E3));box-shadow:0 14px 34px color-mix(in srgb,var(--r2,#1594BE) 30%,transparent)}
.timer .seg{background:rgba(255,255,255,.16)}
.timer .seg button,.timer .seg button:hover{background:none;color:rgba(255,255,255,.8)}
.timer .seg button[aria-pressed=true]{background:#fff;color:var(--g1,#1B378F)}
.ring{position:relative;width:min(264px,74vw);aspect-ratio:1;margin:1.1rem auto .9rem}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.2)}
.ring .fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem}
.phase{margin:0;font-weight:500;font-size:.92rem;color:rgba(255,255,255,.85)}
.digits{font:600 clamp(3rem,15vw,3.9rem)/1 var(--serif);letter-spacing:-.02em}
.digits .d{display:inline-block;width:.6em;text-align:center}
.timer[data-sw] .digits{font-size:clamp(2.3rem,11.5vw,2.9rem)}
.dots{display:flex;gap:.4rem;justify-content:center;min-height:9px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:#fff}
.pick{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:0 0 1rem}
.pick label{display:flex;align-items:center;gap:.4rem;font-size:.84rem;color:rgba(255,255,255,.85)}
.pick select{max-width:11rem}
.timer select,.timer input[type=text]{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.timer select option{color:#0F1E3D;background:#fff}
.timer input::placeholder{color:rgba(255,255,255,.65)}
.timer select:focus,.timer input:focus{border-color:#fff;outline-color:rgba(255,255,255,.3)}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.timer button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
.timer button:hover{background:rgba(255,255,255,.24);border-color:#fff;color:#fff}
.timer .btns .primary{min-width:8rem;min-height:46px;border-radius:99px;background:#fff;border-color:#fff;color:var(--g1,#1B378F);filter:none}
.timer[data-rest] .btns .primary,.timer[data-rest] .seg button[aria-pressed=true]{color:var(--r1,#0C5874)}
.timer .btns button{border-radius:99px}
.timer button.quiet{background:none;border-color:transparent;color:rgba(255,255,255,.85)}
.timer :focus-visible{outline-color:#fff}
.last{margin-top:1.1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.25);text-align:left}
.last .muted{color:rgba(255,255,255,.8)}
.rate{display:inline-flex;gap:.3rem}
.rate button{min-height:32px;width:32px;padding:0;border-radius:50%}
.rate button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.timer .rate button[aria-pressed=true]{background:#fff;color:var(--g1,#1B378F);border-color:#fff}

.tasks{list-style:none;margin:.4rem 0;padding:0}
.tasks li{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--rule)}
.tasks .t{flex:1;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:flex-start;gap:.2rem}
.tag,.tag:hover{display:inline-flex;align-items:center;gap:.3rem;max-width:100%;min-height:0;padding:.12em .65em;border:0;border-radius:99px;font-size:.76rem;font-weight:500;
  color:var(--ink);background:color-mix(in srgb,var(--c) 24%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.hms#k-due-box{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .5rem}
#k-due-box input{width:auto;min-width:0} #k-due-box #k-due{min-width:9.5em} #k-due-box>span:first-child{white-space:nowrap}
#k-due-box .hint{flex-basis:100%;font-size:.78rem}
.tdue{display:block;width:100%;font-size:.78rem;color:var(--ink2)}
.tdue.soon{color:var(--soon);font-weight:500} .tdue.urgent{color:var(--warn);font-weight:500} .tdue.late{color:var(--warn);font-weight:600} .tdue.ok{color:var(--rest)}
.tcmp{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .7rem;width:100%;font-size:.78rem;color:var(--ink2)}
.tcmp .over{color:var(--warn);font-weight:500} .tcmp .left{color:var(--accent);font-weight:500}
.tbar{flex-basis:100%;max-width:16rem;height:4px;border-radius:99px;background:var(--soft);overflow:hidden}
.tbar i{display:block;height:100%;border-radius:99px;background:var(--accent)} .tbar.over i{background:var(--warn)}
.hms{display:inline-flex;align-items:center;gap:.25rem;font-size:.84rem;color:var(--ink2)} .hms input{width:3.5em;padding-right:.2em}
.tag.none{color:var(--ink2);background:var(--soft)}
.tasks li.done .t{text-decoration:line-through;color:var(--ink2)}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;flex:none}
.addrow{display:flex;flex-wrap:wrap;gap:.4rem}
.addrow input[type=text]{flex:1;min-width:9rem}
.empty{color:var(--ink2);padding:.8rem 0}

/* 텐미닛 타임테이블 */
.tt{user-select:none;-webkit-user-select:none}
.tt-head,.tt-row{display:grid;grid-template-columns:2.1rem 1fr;align-items:stretch}
.tt-head span{font-size:.72rem;color:var(--ink2);text-align:center;padding-bottom:.2rem}
.tt-head div{display:grid;grid-template-columns:repeat(6,1fr)}
.tt-row .hr{font:500 .8rem var(--serif);color:var(--ink2);text-align:right;padding-right:.5rem;line-height:28px}
.track{position:relative;display:grid;grid-template-columns:repeat(6,1fr);height:28px;border-left:1px solid var(--rule2);border-bottom:1px solid var(--rule)}
.tt-head + .tt-row .track{border-top:1px solid var(--rule2);border-top-right-radius:8px}
.tt-row:last-child .track{border-bottom-color:var(--rule2);border-bottom-right-radius:8px}
.cell{border-right:1px solid var(--rule);cursor:cell}
@media (hover:hover){.cell:hover{background:var(--soft)}}
.cell:nth-child(3){border-right-color:var(--rule2)} .cell:nth-child(6){border-right-color:var(--rule2)}
.cell.sel{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.bar{position:absolute;top:4px;bottom:4px;border-radius:5px;background:var(--c);opacity:var(--hl);mix-blend-mode:var(--blend);border:0;padding:0;min-height:0;cursor:pointer}
.bar:hover{background:var(--c);opacity:1}
.bar{color:#0F1E3D;font-size:.68rem;font-weight:500;line-height:20px;text-align:left;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar.live{background-image:repeating-linear-gradient(90deg,transparent 0 5px,rgba(255,255,255,.55) 5px 8px)}
.fix{position:absolute;top:1px;bottom:1px;border:1px dashed var(--rule2);border-radius:5px;pointer-events:none;overflow:hidden;
  background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--accent) 12%,transparent) 5px 6px);
  font-size:.68rem;line-height:24px;padding-left:5px;color:var(--ink2);white-space:nowrap}
.fix.sch{border:0;background:color-mix(in srgb,var(--c) 32%,transparent);color:var(--ink)}
.schl,.schl:hover{pointer-events:auto;background:none;border:0;padding:0;min-height:0;font:inherit;color:inherit;cursor:pointer;text-align:left;border-radius:0;font-weight:500}
.schl:hover{text-decoration:underline}
.now{position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:2px;background:var(--warn);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-top:.8rem;font-size:.84rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}

/* 통계 */
.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.figs>div{background:var(--soft);border-radius:12px;padding:.7rem .85rem}
.figs b{display:block;font:600 1.3rem var(--serif);letter-spacing:-.01em;color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;position:relative;border-bottom:1px solid var(--rule2);margin-top:1.6rem}
.bars .b{flex:1;display:flex;flex-direction:column-reverse;height:100%;min-width:0;border-radius:5px 5px 0 0;overflow:hidden}
.bars .b i{display:block;flex:none}
.bars .goalline{position:absolute;left:0;right:0;border-top:1px dashed var(--rule2);font-size:.7rem;color:var(--ink2);text-align:right;line-height:1;pointer-events:none}
.bars .goalline span{position:relative;top:-1.1em}
.xl{display:flex;gap:4px;font-size:.7rem;color:var(--ink2);margin-top:.25rem} .xl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.share{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--soft)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl td,.tbl th{padding:.45rem .5rem .45rem 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.tbl th{font-weight:500;color:var(--ink2)}
.scroll{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;width:max-content}
.heat i{border-radius:4px;background:var(--soft)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--surface))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 54%,var(--surface))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 78%,var(--surface))}
.heat i[data-l="4"]{background:var(--accent)}
.heat i.fut{background:transparent}

.dayb{min-height:32px;padding:0 .55em} .dayb[aria-pressed=true],.dayb[aria-pressed=true]:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
mark{background:color-mix(in srgb,var(--accent) 26%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.found{max-height:52vh;overflow-y:auto}
button.chip{border:0;min-height:0;cursor:pointer} button.chip:hover{background:var(--accent);color:var(--on-accent)}
#rv-text{width:100%;resize:vertical;line-height:1.6;padding:.5em .7em;margin-top:.8rem;min-height:5.5em}

/* 목표 */
.grow{margin-top:.65rem;font-size:.84rem} .grow .goal{margin-top:.25rem}
.goals{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:.8rem}
.gcard,.gcard:hover{display:block;width:100%;text-align:left;font-weight:400;color:var(--ink);padding:.8rem .9rem;border-radius:14px;border:1px solid var(--rule);background:var(--surface)}
.gcard:hover{border-color:var(--accent)} .gcard[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.gcard .bars{height:56px;margin-top:.9rem;gap:2px}
.gtbl input{width:5em}
.fav[aria-pressed=true],.fav[aria-pressed=true]:hover{color:#C98A00;background:color-mix(in srgb,#F2CB3D 22%,transparent)}

/* 일정 */
.week{display:grid;grid-template-columns:2.1rem repeat(7,minmax(64px,1fr));min-width:540px}
.week .dh{text-align:center;font-size:.84rem;padding-bottom:.35rem;color:var(--ink2)}
.week .dh.on{color:var(--accent);font-weight:600}
.week .hrs div{font:500 .76rem var(--serif);color:var(--ink2);text-align:right;padding-right:.45rem;height:40px;transform:translateY(-.6em)}
.week .col{position:relative;border-left:1px solid var(--rule);background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 40px}
.week .col:last-child{border-right:1px solid var(--rule)}
.ev{position:absolute;left:2px;right:2px;border-radius:7px;padding:3px 5px;font-size:.74rem;font-weight:500;line-height:1.25;overflow:hidden;text-align:left;min-height:0;
  border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 28%,var(--surface));color:var(--ink)}
.ev:hover{color:var(--ink);background:color-mix(in srgb,var(--c) 40%,var(--surface))}
.list{list-style:none;margin:.4rem 0 0;padding:0}
.list li{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--rule)}

/* 캘린더 */
.calwrap{display:grid;gap:1rem}

const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dayKey=ts=>keyOf(new Date(ts-cfg('dayStart')*3600e3));
const parts=k=>k.split('-').map(Number);
const dayStartTs=k=>{const [y,m,d]=parts(k); return new Date(y,m-1,d,cfg('dayStart')).getTime()};
const addDays=(k,n)=>{const [y,m,d]=parts(k); return keyOf(new Date(y,m-1,d+n))};
const wdOf=k=>{const [y,m,d]=parts(k); return (new Date(y,m-1,d).getDay()+6)%7};
const monthOf=ts=>keyOf(new Date(ts)).slice(0,7);
const today=()=>dayKey(Date.now());
const sessDur=s=>s.segs.reduce((a,g)=>a+(g[1]-g[0]),0);

/* 날짜별 집계 (하루 시작 시각 기준으로 나눔) */
let agg=null, spanC=null;
function getAgg(){
  if(agg) return agg; const days={};
  allOf('log-').forEach(s=>s.segs.forEach(g=>{
    let a=g[0]*1e3; const b=g[1]*1e3;
    while(a<b){const k=dayKey(a), st=dayStartTs(k), end=Math.min(b,st+864e5);
      const D=days[k]||(days[k]={total:0,bySub:{},byCat:{},segs:[]}); const len=(end-a)/1e3, cc=catOf(s.sub); D.byCat[cc]=(D.byCat[cc]||0)+len;
      D.total+=len; D.bySub[s.sub||'']=(D.bySub[s.sub||'']||0)+len; D.segs.push({a:(a-st)/6e4,b:(end-st)/6e4,s});
      a=end;}
  }));
  return agg=days;
}
const dayTotal=(k,c)=>{const D=getAgg()[k]; return !D?0:c?D.byCat[c]||0:D.total};

let col=null, cloud='local', pushT=null, pushing=false;
const CL={local:TR('이 기기에 저장'),connecting:TR('클라우드 연결 중'),syncing:TR('저장 중'),synced:TR('클라우드에 저장됨'),error:TR('클라우드 연결 끊김, 기기에 저장 중')};
function setCloud(s){cloud=s; paintSync()}
function paintSync(){const b=$('#sync'); let s=cloud, t=CL[cloud];
  if(cloud==='local'){if(fState==='on'){s='synced'; t='"'+dirName+TR('" 폴더에 저장됨')} else if(fState==='need'){s='error'; t=TR('데이터 폴더 다시 연결 필요')} else if(memOnly) t=TR('저장 불가 (이 창에서만 유지)')}
  b.dataset.s=s; b.textContent=t}
function mergeDoc(id,data){ // 원격 → 로컬. 반환: [로컬이 바뀜, 원격에 없는 게 있음]
  let changed=false, need=false;
  if(id==='settings'){const m=data?data.m||0:0;
    if(m>S.settings.m){S.settings={m,v:clone(data.v||{})}; changed=true} else if(m<S.settings.m) need=true;
    return [changed,need];}
  const loc=S.docs[id]||(S.docs[id]={}), rm={};
  ((data&&data.items)||[]).forEach(it=>{rm[it.id]=it.m; const l=loc[it.id]; if(!l||l.m<it.m){loc[it.id]=clone(it); changed=true}});
  for(const k in loc) if(!(k in rm)||rm[k]<loc[k].m){need=true;break}
  return [changed,need];
}
function onSnap(snap){
  let changed=false; const seen={};
  snap.docs.forEach(ds=>{const data=ds.data(); if(!data) return; seen[ds.id]=1;
    const r=mergeDoc(ds.id,data); if(r[0]) changed=true; if(r[1]) S.dirty[ds.id]=1;});
  for(const d in S.docs) if(!seen[d]&&Object.keys(S.docs[d]).length) S.dirty[d]=1;
  if(!seen.settings&&S.settings.m) S.dirty.settings=1;
  saveLocal(); if(changed){agg=null; spanC=null; render()}
  const dirty=Object.keys(S.dirty).length>0; setCloud(dirty?'syncing':'synced'); if(dirty) schedulePush();
}
function schedulePush(ms){if(!col) return; clearTimeout(pushT); pushT=setTimeout(push,ms||1200)}
async function push(){
  if(pushing||!col) return; pushing=true; let cur=null, changed=false;
  try{
    for(const d of Object.keys(S.dirty)){
      cur=d; delete S.dirty[d];
      const ref=col.doc(d), snap=await ref.get();
      const r=mergeDoc(d,snap.exists?snap.data():null); if(r[0]) changed=true;
      if(r[1]) await ref.set(d==='settings'?{m:S.settings.m,v:S.settings.v}:{items:Object.values(S.docs[d]||{})});
      cur=null;
    }
    saveLocal(); if(changed){agg=null; spanC=null; render()}
    if(Object.keys(S.dirty).length){setCloud('syncing'); schedulePush()} else setCloud('synced');
  }catch(e){
    if(cur) S.dirty[cur]=1; saveLocal();
    const c=e&&e.code;
    if(c==='revoked'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){col=null; setCloud('local')}
    else{setCloud('error'); if(c==='quota_exceeded') toast(TR('클라우드 저장 공간이 가득 찼어요. 기록은 이 기기에 남아 있어요.')); else schedulePush(20000)}
  }
  pushing=false;
}
let downloads=null, assets=null;
async function initCloud(){
  if(!window.claude||!window.claude.use){setCloud('local'); return}
  setCloud('connecting');

const DATA_FILE='스케줄러-데이터.json', PHOTO_DIR='사진', EXTS=['jpg','png','gif','webp'], EXT={'image/jpeg':'jpg','image/png':'png','image/gif':'gif','image/webp':'webp'};

function mergeBackup(p){ // 파일 내용 → 지금 기록에 합치기 (항목마다 더 최근 것이 남음)
  let n=0; if(!p||!p.docs) return 0;
  for(const d in p.docs){if(!/^[\w.\-]+$/.test(d)) continue; const loc=S.docs[d]||(S.docs[d]={});
    for(const k in p.docs[d]){const it=p.docs[d][k]; if(it&&it.id&&(!loc[it.id]||loc[it.id].m<it.m)){loc[it.id]=it; n++}} S.dirty[d]=1}
  if(p.settings&&(p.settings.m||0)>S.settings.m){S.settings={m:p.settings.m,v:p.settings.v||{}}; S.dirty.settings=1; n++}
  if(n){agg=null; spanC=null} return n;
}
function scheduleFolder(){if(fState!=='on') return; clearTimeout(fT); fT=setTimeout(folderWrite,700)}

function exRange(kind,date,from,to){ // 하루·일주일·한 달·일 년·직접 지정 → [시작, 끝]
  if(kind==='day') return [date,date];
  if(kind==='week'){const a=addDays(date,-wdOf(date)); return [a,addDays(a,6)]}
  if(kind==='month'){const y=parts(date)[0], m=parts(date)[1]; return [y+'-'+pad(m)+'-01',y+'-'+pad(m)+'-'+pad(new Date(y,m,0).getDate())]}
  if(kind==='year'){const y=parts(date)[0]; return [y+'-01-01',y+'-12-31']}
  return from<=to?[from,to]:[to,from];
}

/* 움직임: 한 타이머가 0.25초마다 모든 유리병 속 동물의 그림을 한 장씩 넘겨요 */
const ACTORS=[], PST={}, FX={}; let actTimer=null, actN=0;
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const SEQ={stand:['stand','stand','stand','stand','squash','squash'],walk:['stand','squash'],read:['read0','read0','read0','read1'],write:['write0','write1'],sleep:['sleep0','sleep0','sleep0','sleep1','sleep1','sleep1'],
  wag:['wag0','wag1'],cheer:['cheer0','cheer1'],eat:['eat0','eat1'],sad:['sad0','sad0','sad0','sad1'],egg:['egg','egg','egg','egg1','egg','egg2','egg','egg']};
function petReact(kind,ms){FX.kind=kind; FX.until=Date.now()+(ms||3000)}
function focusState(){return {run:!!T.running, focus:T.running&&isFocus(), rest:T.running&&!isFocus()}}
function actorPose(a){ // 지금 상황에 맞는 행동 고르기
  const p=a.pet, st=a.st, now=Date.now(), F=focusState(), act=a.active;
  if(st===0) return 'egg';
  if(a.fixed) return a.fixed;
  if(act&&FX.until>now) return FX.kind;
  if(F.focus) return act?(Math.floor(now/8000)%3===2?'write':'read'):'wag';
  if(F.rest) return 'sleep';
  if(a.sad) return a.walk>0?'walk':'sad';
  const hr=hourNow(); if(hr>=23.5||hr<6) return 'sleep';
  return a.walk>0?'walk':a.idle||'stand';
}
function stepActor(a){
  const pose=actorPose(a), F=focusState(), act=a.active;
  if(a.st&&!a.fixed){ // 걷기: 목표 지점으로 한 칸씩
    if((F.focus&&act)&&Math.abs(a.x-a.desk)>0){a.dir=a.desk>a.x?1:-1; a.x+=a.dir; a.walk=1}
    else if(F.focus&&act){a.walk=0; a.dir=1}
    else if(pose==='walk'||pose==='stand'||pose==='sad'){
      if(a.walk>0){a.x+=a.dir; a.walk--; if(a.x<a.min||a.x>a.max){a.x=Math.max(a.min,Math.min(a.max,a.x)); a.walk=0}}
      else if(Math.random()<(a.sad?.02:.06)){a.dir=Math.random()<.5?-1:1; a.walk=4+Math.floor(Math.random()*14); a.idle=''}
      else if(!a.idle&&Math.random()<.03) {a.idle='wag'; a.idleT=8+Math.floor(Math.random()*8)}
    }
    if(a.idle&&--a.idleT<=0) a.idle='';
    PST[a.pet.id]={x:a.x,dir:a.dir};
  }
  const seq=SEQ[pose==='walk'?'walk':pose]||SEQ.stand; a.fi=(a.fi+1)%seq.length; let fr=seq[a.fi%seq.length];
  if(fr==='stand'&&Math.random()<.04) fr='blink';
  if(pose==='walk'&&a.sad) fr=a.fi%2?'sad1':'sad0';
  showFrame(a,fr);
  if(a.label){const tx=POSE_TXT[pose]||''; if(a.label.textContent!==tx) a.label.textContent=tx}
}
function showFrame(a,fr){

  if(a.cur!==key){a.cur=key; a.g.innerHTML=spriteSVG(a.pet.sp,a.st,a.pet.wear,fr,a.xp,flip)}

}
function engine(){
  actN++; for(let i=ACTORS.length-1;i>=0;i--){const a=ACTORS[i]; if(!a.svg.isConnected){ACTORS.splice(i,1); continue} if(document.visibilityState==='visible'&&a.svg.getBoundingClientRect().width) stepActor(a)}
  WXL.forEach((w,i)=>{if(!w.svg.isConnected){WXL.splice(i,1); return} if(w.frames.length>1) w.g.innerHTML=w.frames[actN%w.frames.length]});
  if(buddyEl&&!buddyEl.hidden&&document.visibilityState==='visible') stepBuddy();
  if(!ACTORS.length&&!WXL.length&&!(buddyEl&&!buddyEl.hidden)){clearInterval(actTimer); actTimer=null}
}

const COIN='🪙';
const coinBal=()=>allOf('coins-').reduce((a,c)=>a+(c.amt||0),0);
const coinToday=()=>{const k=today(); return allOf('coins-').filter(c=>c.amt>0&&dayKey(c.ts)===k).reduce((a,c)=>a+c.amt,0)};

function award(id,amt,why){ // 같은 일로 두 번 받지 않게 id로 확인 (여러 기기에서도 한 번만)
  if(!amt||findDoc('coins-',id)) return 0;
  const ts=Date.now(); put('coins-'+monthOf(ts),{id,ts,amt,why}); paintCoin(); return amt;
}
function unaward(id){const d=findDoc('coins-',id); if(d){del(d,id); paintCoin()}}

  const bal=coinBal(); if(bal<amt){toast(TR('코인이 모자라요')+' ('+bal+' / '+amt+')'); return false}
  const ts=Date.now(); put('coins-'+monthOf(ts),Object.assign({id:uid(),ts,amt:-amt,why},kind?{kind}:{})); paintCoin(); return true;
}

const celebQ=[]; let celebOn=false;

  const c=celebQ.shift(); if(!c){celebOn=false; return} celebOn=true; const [big,sub,special]=c;
  if(cfg('sound')) coinSound(special);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){toast(big+(sub?' · '+sub:'')); setTimeout(nextCeleb,900); return}
  const p=activePet(), cv=h('canvas',{class:'confetti'}), box=h('div',{class:'celeb pxui'+(special?' special':'')},
    p?h('span',{class:'celeb-pet'},cheerSprite(p,5)):null,h('b',null,...pxText(big)),sub?h('span',null,...pxText(sub)):null); petReact('cheer',2600);
  document.body.append(cv,box);
  const W=cv.width=innerWidth, H2=cv.height=innerHeight, g=cv.getContext('2d'), cols=['#F5C542','#FF6FA5','#6FCFAB','#6FB6EE','#AE98EC','#F39B52'], n=special?110:60;
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H2*.32,vx:(Math.random()-.5)*9,vy:-Math.random()*11-3,s:4+Math.floor(Math.random()*3)*2,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  const step=t=>{const e=t-t0; g.clearRect(0,0,W,H2); ps.forEach(q=>{q.vy+=.38; q.x+=q.vx; q.y+=q.vy; g.fillStyle=q.c; g.fillRect(Math.round(q.x/4)*4,Math.round(q.y/4)*4,q.s,q.s)});

const dayKept=k=>rewardDay(k)>=300||tasksOf(k).some(t=>t.done);
function softStreak(){
  const t0=today(), used={}; let k=t0, n=0, start=null, first=null;
  allOf('log-').forEach(s=>{const d=dayKey(s.segs[0][0]*1e3); if(!first||d<first) first=d}); allOf('tasks-').forEach(t=>{if(t.done&&(!first||t.date<first)) first=t.date});
  if(!first) return {n:0,start:null,shield:true};
  if(!dayKept(k)) k=addDays(k,-1); // 오늘은 아직 끝나지 않았으니 비어 있어도 끊지 않음
  while(k>=first){const wk=addDays(k,-wdOf(k));
    if(dayKept(k)){n++; start=k} else if(!used[wk]) used[wk]=1; else break;
    k=addDays(k,-1)}
  return {n,start,shield:!used[addDays(t0,-wdOf(t0))]};
}
const MILES=[3,7,14,30,50,100,200,365];

  if(Notification.permission==='denied') return TR('알림이 막혀 있어요. ')+(isIOS?TR('아이폰 설정 → 알림 → Align에서 허용해 주세요.'):TR('맥의 시스템 설정 → 알림에서 Align(또는 쓰는 브라우저)을 허용하고, 크롬이라면 주소창 왼쪽 아이콘 → 알림도 허용해 주세요.'))+TR(' 그다음 아래 버튼을 다시 누르세요.');
  return TR('켜면 뽀모도로가 끝날 때, 할 일 마감 전, 일정 시작 전에 알림이 와요. 알림 허용은 기기마다 따로 해야 해요.');
}

  '// Align 위젯: 이 몇 줄이 최신 위젯을 받아 와서 실행해요. 고칠 필요 없어요.',
  "const U='"+new URL('widget.js',location.href).href+"', fm=FileManager.local(), p=fm.joinPath(fm.documentsDirectory(),'align-widget-code.js');",

    h('ol',{class:'steps small'},

      st(TR('Scriptable을 열고 오른쪽 위 '),h('b',null,'+'),TR('를 눌러 빈 화면에 붙여넣은 뒤, 맨 위 제목을 '),h('b',null,'Align'),TR('으로 바꾸고 '),h('b',null,TR('완료')),TR('를 누르세요.')),
      st(TR('목록의 '),h('b',null,'Align'),TR('을 한 번 눌러 실행하고, 동기화에 쓰는 이메일·비밀번호로 로그인하세요.')),
      st(TR('홈 화면 빈 곳을 길게 눌러 '),h('b',null,TR('편집 → 위젯 추가 → Scriptable')),TR('에서 크기를 골라 추가하고, 그 위젯을 길게 눌러 '),h('b',null,TR('위젯 편집 → Script → Align')),TR('을 고르세요.')),
      st(TR('오늘 일정만 보는 위젯을 따로 두려면 같은 방법으로 하나 더 추가하고, '),h('b',null,TR('위젯 편집 → Parameter')),TR('에 '),h('b',null,TR('일정')),TR('이라고 적으세요. 잠금 화면 위젯에도 똑같이 쓸 수 있어요.')),
      st(TR('동물을 지켜보는 위젯은 '),h('b',null,TR('위젯 편집 → Parameter')),TR('에 '),h('b',null,TR('동물')),TR('이라고 적으세요. 앱의 유리병 속 동물이 시간과 타이머에 따라 책을 읽거나 자는 모습으로 보여요. 잠금 화면에서도 돼요.'))),
    h('label',null,TR('위젯의 집중 시간 기준'),(()=>{const v=S.settings.v.widgetCat!=null?S.settings.v.widgetCat:gc(); // 위젯에 보이는 집중 시간·목표 %를 이 카테고리로만 계산
      return h('select',{onchange:e=>{setCfg('widgetCat',e.target.value); toast(TR('위젯이 다음에 새로 고쳐질 때 바뀌어요'))}},h('option',{value:'',selected:!v},TR('전체')),cats().filter(c=>!c.arch||c.id===v).map(c=>h('option',{value:c.id,selected:c.id===v},c.name)))})()),

const chkCfg=k=>h('input',{type:'checkbox',checked:!!cfg(k),onchange:e=>setCfg(k,e.target.checked)});
const numCfg=(k,mn,mx)=>h('input',{type:'number',min:mn,max:mx,value:cfg(k),onchange:e=>{let v=parseInt(e.target.value); v=isNaN(v)?mn:Math.min(mx,Math.max(mn,v)); setCfg(k,v)}});

/* ---------- 아이폰 앱(홈 화면에 추가) ---------- */
function saveFile(filename,data,type,done){ // 아이폰에서는 공유 시트로 열어 '파일에 저장'·AirDrop 등을 고를 수 있게 함
  let file=null; try{file=new File([data],filename,{type})}catch(e){}
  if(file&&matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(()=>toast(done)).catch(e=>{if(!e||e.name!=='AbortError') toast(TR('공유하지 못했어요. 다시 해 보세요.'))}); return}
  const a=h('a',{href:URL.createObjectURL(new Blob([data],{type})),download:filename}); (dlg.open?dlg:document.body).append(a); a.click(); a.remove(); toast(done);
}
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!window.claude){
  const hadSW=!!navigator.serviceWorker.controller, t0=Date.now();
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
  // 새 버전이 막 깔렸으면, 앱을 연 직후(아직 아무것도 안 하고 있을 때)에만 한 번 새로 고쳐 바로 반영
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&Date.now()-t0<15000&&!dlg.open&&!typing(document.activeElement)&&!T.running) location.reload()});
}
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); // 기기 저장 공간이 부족해도 기록을 지우지 않도록 요청
const typing=el=>!!el&&(el.tagName==='TEXTAREA'||el.isContentEditable||(el.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|file|color|range|date|time|datetime-local|month|week)$/.test(el.type)));
document.addEventListener('focusin',e=>{if(typing(e.target)) document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!typing(document.activeElement)) document.body.classList.remove('kb')},60));

})();
